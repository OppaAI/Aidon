[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aidon"
version = "0.1.0"
description = "An autonomous agent that works from a plain-language goal."
requires-python = ">=3.11"
dependencies = ["qdrant-client>=1.10"]

[project.optional-dependencies]
embed = ["sentence-transformers>=6.1", "transformers", "Pillow"]
sparse = ["fastembed"]
kb = ["pypdf", "python-docx", "beautifulsoup4"]

[tool.setuptools]
packages = ["src"]
