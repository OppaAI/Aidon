[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aidon"
version = "0.1.0"
description = "An autonomous agent that works from a plain-language goal."
requires-python = ">=3.11"
dependencies = [
    "qdrant-client>=1.20.0",
]

[project.scripts]
aidon = "src.system.main:main"

[project.optional-dependencies]
embed = [
    "sentence-transformers>=6.1",
    "transformers",
    "torchvision>=0.29.1",
]
vision = [
    "Pillow>=13.0.0",
]
memory = [
    "qdrant-client>=1.10",
]
sparse = [
    "fastembed>=0.3",
]
kb = [
    "pypdf",
    "python-docx",
    "beautifulsoup4",
]
docs = [
    "ebooklib>=0.20",
    "markdown>=3.11.2",
    "markitdown>=0.1.9",
]

[tool.setuptools]
packages = ["src", "src.system", "src.memory", "src.agentic", "src.interface", "src.capabilities", "src.social"]

[tool.setuptools.package-data]
"src.interface" = ["static/**/*"]
