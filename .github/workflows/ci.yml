# CI: Python correctness checks, regression tests, and WebUI JavaScript.
# No secrets, no deploys, no Docker, no optional-dependency installs.
# pytest is not a declared project dependency, so it is installed here;
# the suite itself needs stdlib + pytest only (qdrant-client is optional
# at runtime: the memory store falls back to SQLite when it is absent).
name: CI

"on":
  push:
    branches: [dev]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install check tools
        run: python3 -m pip install pytest ruff
      - name: Check Python correctness
        run: python3 -m ruff check --select F821,F822,F823,E9 src scripts
      - name: Run test suite
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          PYTHONPATH: "src:."
        run: python3 -m pytest tests/ -q
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Check WebUI JavaScript
        run: find src/interface/static -name '*.js' -print0 | xargs -0 -r -n1 node --check
