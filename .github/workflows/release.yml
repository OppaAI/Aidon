name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Confirm tag matches package version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          tag = os.environ["REF_NAME"]
          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          if tag != f"v{version}":
              raise SystemExit(f"Tag {tag} does not match project version v{version}")
          PY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          PYTHONPATH: "src:."
        run: |
          python3 -m pip install pytest ruff
          python3 -m ruff check --select F821,F822,F823,E9 src scripts
          python3 -m pytest tests/ -q

      - name: Check WebUI JavaScript
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Validate WebUI JavaScript
        run: find src/interface/static -name '*.js' -print0 | xargs -0 -r -n1 node --check

      - name: Prepare release notes from changelog
        env:
          REF_NAME: ${{ github.ref_name }}
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          version = os.environ["REF_NAME"][1:]
          text = Path("CHANGELOG.md").read_text(encoding="utf-8")
          heading = f"## [{version}]"
          lines = text.splitlines()
          try:
              start = next(i for i, line in enumerate(lines)
                           if line.startswith(heading))
          except StopIteration:
              raise SystemExit(f"CHANGELOG.md has no {heading} section")
          end = next((i for i in range(start + 1, len(lines))
                      if lines[i].startswith("## ")), len(lines))
          notes = "\n".join(lines[start + 1:end]).strip()
          if not notes:
              raise SystemExit(f"CHANGELOG.md section {heading} is empty")
          path = Path(os.environ["RUNNER_TEMP"]) / "release-notes.md"
          path.write_text(notes + "\n", encoding="utf-8")
          PY

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: type=ref,event=tag

      - name: Build and publish container
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          gh release create "$REF_NAME" \
            --title "$REF_NAME" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
